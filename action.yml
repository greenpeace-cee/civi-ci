name: "CiviCRM CI"
description: >-
  Builds a CiviCRM instance for extension tests. Deprecated: use the reusable
  workflow .github/workflows/tests.yml instead, see README.md.

inputs:
  civicrm:
    description: "CiviCRM version"
    default: 'master'
  php:
    description: "PHP version"
    default: "8.1"
  extension:
    required: true
  build-type:
    description: "civibuild build type"
    default: "drupal-clean"

outputs:
  ext-dir:
    description: "Extension Directory"
    value: ${{ steps.export-paths.outputs.ext-dir }}

runs:
  using: "composite"
  steps:
    - id: "install-deps"
      name: "Install dependencies"
      shell: bash
      run: |
        sudo add-apt-repository ppa:ondrej/php
        sudo apt-get update
        sudo apt-get install lynx php${{ inputs.php }}
        # PHP extensions required by CiviCRM:
        # https://docs.civicrm.org/sysadmin/en/latest/requirements/#php-extensions
        sudo apt-get install -y $(printf "php${{ inputs.php }}-%s " bcmath curl gd intl mbstring mysql xml zip)
        sudo apt-get install -y --no-install-recommends "libapache2-mod-php${{ inputs.php }}"
        sudo a2enmod rewrite
        # Run Apache as the same user as civibuild and the tests, so that
        # files they write into the build (caches, ...) stay replaceable.
        sudo sed -i "s/^export APACHE_RUN_USER=.*/export APACHE_RUN_USER=$(id -un)/; s/^export APACHE_RUN_GROUP=.*/export APACHE_RUN_GROUP=$(id -gn)/" /etc/apache2/envvars
        sudo systemctl restart apache2
        cd /home/runner
        wget https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh
        bash ./install.sh
        . ./.nvm/nvm.sh
        nvm install 22

    - id: "install-buildkit"
      name: "Install CiviCRM buildkit"
      shell: bash
      run: |
        cd /home/runner
        git clone https://github.com/civicrm/civicrm-buildkit.git ./buildkit
        ./buildkit/bin/civi-download-tools

    - id: "amp-config"
      name: "Configure amp"
      shell: bash
      run: |
        PATH="/home/runner/buildkit/bin:$PATH"
        amp config:set --db_type="mysql_dsn"
        amp config:set --hosts_type="file"
        amp config:set --httpd_type="apache24"
        amp config:set --httpd_restart_command="sudo /usr/sbin/apachectl graceful"
        amp config:set --mysql_dsn="mysql://root@localhost:3306"
        amp config:set --perm_type="worldWritable"
        sudo chmod 666 "/etc/apache2/apache2.conf"
        echo "IncludeOptional /home/runner/.amp/apache.d/*.conf" >> "/etc/apache2/apache2.conf"
        amp test

    - id: "build-instance"
      name: "Build a CiviCRM instance"
      shell: bash
      run: |
        /home/runner/buildkit/bin/civibuild create "civi" \
          --civi-ver "${{ inputs.civicrm }}" \
          --title "CiviCRM (${{ inputs.civicrm }})" \
          --type "${{ inputs.build-type }}" \
          --url "http://civi.test:8080"

    - id: "check-build"
      name: "Check the build is reachable over HTTP"
      shell: bash
      run: |
        case "${{ inputs.build-type }}" in
          standalone*) path="civicrm/login" ;;
          wp*) path="wp-login.php" ;;
          *) path="user/login" ;;
        esac
        PATH="/home/runner/buildkit/bin:$PATH"
        cd "/home/runner/buildkit/build/civi"
        url=$(cv url "$path" | tr -d '"')
        status=$(curl -sS -o "$RUNNER_TEMP/login.html" -w '%{http_code}' "$url" || true)
        echo "GET $url -> HTTP $status"
        if [ "$status" != 200 ]; then
          head -c 2000 "$RUNNER_TEMP/login.html"; echo
          namei -l "$(cv path -d '[cms.root]/index.php')"
          sudo apachectl -M
          php -m
          ls /etc/php/${{ inputs.php }}/*/conf.d /var/lib/php/modules/${{ inputs.php }}/registry
          dpkg -l 'php*' | awk '/^ii/ { print $2 }'
          sudo systemctl status apache2 --no-pager || true
          sudo tail -n 50 /var/log/apache2/error.log /home/runner/.amp/log/*error_log
          exit 1
        fi

    - id: "export-paths"
      name: "Export CiviCRM Paths"
      shell: bash
      run: |
        PATH="/home/runner/buildkit/bin:$PATH"
        cd "/home/runner/buildkit/build/civi"
        ext_dir=$(cv ev 'return CRM_Core_Config::singleton()->extensionsDir' | tr -d '"')
        echo "ext-dir=$ext_dir" >> "$GITHUB_OUTPUT"
