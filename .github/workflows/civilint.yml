name: "civilint"

# Reusable workflow for CiviCRM extensions: runs CiviCRM's `civilint` (php -l,
# phpcs with the CiviCRM coding standard, jshint) over the files a pull request
# touches, like core's style check, and posts `phpcbf` fixes as suggested
# changes. Other events skip the job.
#
# Minimal caller (.github/workflows/civilint.yml in the extension repo):
#
#   on:
#     pull_request:
#   permissions:
#     contents: read
#     pull-requests: write
#   jobs:
#     civilint:
#       uses: greenpeace-cee/civi-ci/.github/workflows/civilint.yml@main
#
# See README.md for the full documentation.

on:
  workflow_call:
    inputs:
      php:
        description: >-
          PHP version `php -l` checks against. Default: the first entry of the
          CIVI_CI_PHP variable, or 8.1, so it matches the unit tests.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  civilint:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed by reviewdog to post suggested changes as review comments.
      pull-requests: write

    steps:
      - id: checkout
        name: "Clone the extension repository"
        uses: actions/checkout@v4
        with:
          # Include the base branch tip (HEAD^1) to diff against.
          fetch-depth: 2

      - id: setup-php
        name: "Set up PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php || fromJSON(vars.CIVI_CI_PHP || '["8.1"]')[0] }}
          coverage: none
          tools: composer, cs2pr

      - id: setup-reviewdog
        name: "Set up reviewdog"
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - id: install-buildkit
        name: "Install civilint from civicrm-buildkit"
        run: |
          git clone --quiet --depth 1 https://github.com/civicrm/civicrm-buildkit.git "$HOME/buildkit"
          cd "$HOME/buildkit"
          # `--no-plugins` skips buildkit's compile/download plugins, which
          # would otherwise fetch every PHAR tool in buildkit. All civilint
          # needs is phpcs/phpcbf and the CiviCRM fork of drupal/coder.
          composer install --no-dev --no-plugins --no-interaction --no-progress --prefer-dist
          # jshint is normally installed by civi-download-tools; replicate the
          # relevant part so civilint can also check .js files.
          npm install --no-save --no-package-lock --no-audit --no-fund jshint
          ln -s ../node_modules/jshint/bin/jshint bin/jshint
          # Keep phpcs' sniff deprecation notices out of the checkstyle XML.
          bin/phpcs --config-set quiet 1
          echo "$HOME/buildkit/bin" >> "$GITHUB_PATH"

      - id: lint
        name: "Run civilint"
        run: |
          # Files the pull request adds or modifies, as in core's `xcivilint`.
          git diff --name-only --diff-filter=d HEAD^1 HEAD > "$RUNNER_TEMP/touched-files"
          echo "::group::Files touched by this pull request"
          cat "$RUNNER_TEMP/touched-files"
          echo "::endgroup::"

          mkdir -p "$RUNNER_TEMP/checkstyle"
          status=0
          civilint --checkstyle "$RUNNER_TEMP/checkstyle" - < "$RUNNER_TEMP/touched-files" || status=$?

          # phpcs reports absolute paths; annotations only attach to the diff
          # when the path is relative to the repository root.
          for report in "$RUNNER_TEMP"/checkstyle/*.xml; do
            [ -e "$report" ] || continue
            sed -i "s#name=\"$GITHUB_WORKSPACE/#name=\"#" "$report"
            cs2pr --prepend-source "$report" || true
          done

          exit "$status"

      - id: suggest-fixes
        name: "Suggest phpcbf fixes"
        # Run even when civilint failed (that is when the suggestions are
        # useful), but not when it was skipped because setup failed.
        if: ${{ !cancelled() && steps.lint.conclusion != 'skipped' }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `--report=diff` is the patch phpcbf would apply. phpcs labels the
          # new side "PHP_CodeSniffer"; reviewdog takes the file name from
          # that side, so copy the real path over.
          grep '\.php$' "$RUNNER_TEMP/touched-files" \
            | xargs -r phpcs-civi -q --report=diff --basepath=. > "$RUNNER_TEMP/phpcbf.diff" || true
          awk '/^--- /{path=substr($0,5)} /^\+\+\+ PHP_CodeSniffer$/{print "+++ " path; next} {print}' \
            "$RUNNER_TEMP/phpcbf.diff" \
            | reviewdog -f=diff -f.diff.strip=0 -name=phpcbf -level=warning \
                -reporter=github-pr-review -filter-mode=added
